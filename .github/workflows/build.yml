name: Build postmarketOS for Samsung Galaxy A52 (samsung-a52q)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install pmbootstrap from official GitLab source
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools git openssl sudo
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/.local/pmbootstrap
          mkdir -p ~/.local/bin
          ln -s ~/.local/pmbootstrap/pmbootstrap.py ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup pmaports with samsung-a52q restored packages
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git pmaports
          cp -r restored_packages/device-samsung-a52q pmaports/device/testing/
          cp -r restored_packages/firmware-samsung-a52q pmaports/device/testing/
          cp -r restored_packages/alsa-ucm-conf-samsung-sm7125 pmaports/device/testing/

      - name: Initialize pmbootstrap non-interactively
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap -y init
          pmbootstrap config target_device samsung-a52q || pmbootstrap config device samsung-a52q
          pmbootstrap config ui phosh
          pmbootstrap config aports "$(pwd)/pmaports"

      - name: Build device package & kernel
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap build device-samsung-a52q --force

      - name: Build postmarketOS rootfs image
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap -y install --on-device-installer --no-fsi || pmbootstrap -y install --password=1234

      - name: Export build artifacts
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p output
          pmbootstrap export "$(pwd)/output"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-a52q
          path: output/*
